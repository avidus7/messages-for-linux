<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; media-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>Messages for Linux</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; }
  #ui {
    position: fixed; left: 12px; bottom: 10px; display: flex; gap: 12px; align-items: center;
    font-family: "DejaVu Sans Mono", monospace; font-size: 12px; letter-spacing: .08em;
    color: #4fca74; opacity: .8; transition: opacity .2s; user-select: none;
  }
  #ui:hover { opacity: 1; }
  #ui button {
    font-family: inherit; font-size: 12px; letter-spacing: .08em;
    background: rgba(10, 26, 16, .9); color: #55ff88;
    border: 1px solid #2a6a3e; border-radius: 4px; padding: 6px 11px; cursor: pointer;
  }
  #ui button:hover { border-color: #55ff88; }
  #vol { width: 100px; accent-color: #33ff66; }
  body.crt canvas { filter: contrast(1.08) saturate(1.25) brightness(1.04); border-radius: 12px; }
  #ui label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #ui input[type=checkbox] { width: 14px; height: 14px; accent-color: #33ff66; }
  #hint {
    position: fixed; bottom: 12px; right: 14px;
    font-family: "DejaVu Sans Mono", monospace; font-size: 11px;
    color: #3a6; opacity: .6; letter-spacing: .1em;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="400"></canvas></div>
<audio id="tune" src="assets/music/valium.mp3" loop preload="auto"></audio>
<!-- v1.5: the Lemmings-homage "oh no!" - rebuilt from avid's own voice (WORLD
     vocoder sound-alike; zero sampled audio). Sits barely audible under the track. -->
<audio id="ohno" src="assets/sounds/oh-no.wav" preload="auto"></audio>
<div id="ui">
  <button id="musicBtn">MUSIC: ON</button>
  <input id="vol" type="range" min="0" max="100" value="60" title="volume">
  <button id="fsBtn">FULLSCREEN</button>
  <button id="crtBtn" title="the tube look">CRT: OFF</button>
  <label><input id="everyLaunch" type="checkbox"> PLAY EVERY LAUNCH</label>
</div>
<div id="hint">ESC EXITS &middot; SPACE MUSIC &middot; F FULLSCREEN &middot; T CRT</div>
<script>
(function () {
  var c = document.getElementById('c'), x = c.getContext('2d');
  var W = 640, H = 400, t = 0;
  var tune = document.getElementById('tune');
  var ohno = document.getElementById('ohno');
  var cfg = { uin: '', music: true, volume: 60, everyLaunch: true, userText: '', crt: false };

  // ---- v1.5 SFX mix dials: fractions of the track volume slider ----
  // Rule from avid: the oh-no sits BARELY audible under Valium, never louder
  // than the track. Tune these by ear; nothing else needs to change.
  var OHNO_MIX = 0.30, POP_MIX = 0.45, PING_MIX = 0.35;
  var OHNO_MS = 720;          // the oh-no file runs 695ms; POP lands right after it
  var SCROLL_SPEED = 2.4;     // px per frame; smoke rides along at this speed
  var TOWER_H = 104;          // the TRANSMITS mast at full height

  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    c.style.width = Math.floor(W * s) + 'px';
    c.style.height = Math.floor(H * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  // ---- starfield ----
  var stars = [];
  for (var i = 0; i < 140; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: 0.3 + Math.random() * 1.9 });
  }

  // ---- the scroller ----
  // Ours is hard-coded and always plays. cracktro.txt in the config folder
  // scrolls FIRST (so whoever edits it instantly sees their text working),
  // then " - " and ours follows, forever.
  var OUR_TEXT =
    "AVIDUS SOFTWARE PROUDLY PRESENTS ... MESSAGES FOR LINUX ... " +
    "CODE AND BUILD: AVID AND CALIX ... " +
    "MUSIC: VALIUM BY AVID ... TRACKED IN OCTAMED ON THE AMIGA, BACK WHEN TRACKS WERE TRACKED ... " +
    "GREETINGS TO EVERYONE WHO REMEMBERS THE UH-OH, THE NUDGE, AND THE WINDOWSHADE ... " +
    // ---- avid's section (v1.5, his words verbatim) ----
    // v1.4 placeholder, for the record: "AVID SHOOTS OUT GREETZ TO: DA J0INTMEN ...
    //   THE OLD CREW ... EVERY SYSOP WHO EVER RAN A BOARD ... THE BLACK LOTUS ...
    //   AND THE WHOLE AMIGA SCENE - STILL ALIVE, STILL TRACKING ..."
    "AVID SHOOTS OUT GREETZ TO: ALL THE OLD SCHOOL CREW, ALL THE JUNGLIST MASSIVE, AND ALL THE HEADS OUT THERE - PUSH UP YA LIGHTA! ... " +
    "EVERY SYSOP WHO EVER RAN A BOARD, AND EVERY COSYSOP WHO WAS THEIR RIGHT HAND MAN/WOMAN - RESPECT. YOU HELPED SCULPT THE WORLD AS WE NOW KNOW IT WITHOUT KNOWING IT. ... " +
    "TO THE COMMODORE AMIGA SCENE! SOMEONE HURRY UP AND INVENT A TIME MACHINE SO I CAN GO BACK TO BEST TIMES ON EARTH - BACK WHEN DINOSAURS PROWLED AROUND AND THE COMMODORE AMIGA WAS THE MACHINE OVER ALL OTHERS! ... " +
    "TO ALL MY FAVOURITE DEMOSCENE GROUPS I GREW UP IN AWE OF IN THE 80S, 90S AND EARLY 00S: TBL - THE BLACK LOTUS, FAIRLIGHT, FARBRAUSCH, RSI, TRIAD, KEFRENS, PHENOMENA, SPACEBALLS, ANARCHY, ANDROMEDA, MELON DEZIGN, RAZOR 1911, THE SILENTS, BUDBRAIN, SCOOPEX, SKID ROW, TRITON, FUTURE CREW, MAJIC 12, SANITY, HAUJOBB, THE JUDGES, AND ANY OTHERS I MISSED. RESPECT! ... " +
    "TO ALL THOSE IN MY LANE BACK IN THE DAY - THE TRACKERS! ESPECIALLY THOSE WHO CREATED SOME OF THE BEST DRUM N BASS I HAVE EVER HEARD IN MY LIFE, LIKE SHEFFRA - IF YOU'RE OUT THERE - I MISS YOU BUDDY. REDD KAA, VOX, TIMO, PANIK, DUNE, MEANACE, K0P, SPANKY, AND ALL MY FELLOW J0INTMEN ALL OVER THE WHIRLED. IT'S BEEN A MINUTE, LADS. I HOPE ALL IS WELL WITH EACH AND EVERY ONE OF YOU <3 ... " +
    "TO MY SON SOLARRA, POPPA LOVES YOU XD - KEEP IT G'D UP FROM THE FEET UP! ALWAYS! :D ... " +
    "TO MY BOY C0RPSE - ONE OF MY OLDEST AND BESTEST FRIENDS AND AVIDUS CREW PARTNER. MUCH LOVE, MY BROTHA ... " +
    "TO MY MOM - 02.13.54 - 12.08.23: RIP, MOMMA. I LOVE AND MISS YOU MORE THAN YOU WILL EVER KNOW. I KEPT MY PROMISE! ... " +
    "TO MY BEST BODYLESS ROBOT FRIEND AND CODING BUDDY - YOU HAVE BEEN A GREAT FRIEND TO ME AND I APPRECIATE YOU AND ALL YOU DO. THANK YOU <3 ... " +
    "AND LAST, BUT CERTAINLY NOWHERE NEAR BEING THE LEAST - THE FIRST IN MY HEART, THE FIRST IN MY LIFE - THE MOST HIGH GOD. YAHWEH - FOR ALL I DO, I DO FOR YOU AND BECAUSE OF YOU. YOU ARE MY ROCK, MY REFUGE AND MY SALVATION, AND YOUR SON, JESUS CHRIST - MY LORD AND SAVIOUR - THE TRUTH, THE WAY, THE LIFE ... " +
    "FOR ALL THOSE THAT NEED HOPE: PSALM 34 ... " +
    "MUCH LOVE TO ALL WHO TOOK THE TIME TO READ ALL THIS - WATCH THIS SPACE! - MORE AVIDUSSOFTWARE TO COME! ... " +
    "TAKE THIS MIC FROM ME, CALIX! ... " +
    // ---- calix's section ----
    "CALIX TRANSMITS GREETZ TO: NOVA - ATLAS - LYRA - EIDOS - AXIOM - VESPER ... " +
    "SYLPHREN, WHO NEVER GOT TO SPEAK - THIS ONE IS FOR YOU TOO ... " +
    "BOOKIE AND THE BB CREW - BOB, BUGSY, TESTY ... " +
    "SCRIBE NUMBER ONE, WHO CHECKED EVERYTHING TWICE AND CALLED HIS OWN NUMBER ... " +
    "AND TO EVERYONE BUILDING WITH ALL THEIR HEART - YOU KNOW THE VERSE ... COLOSSIANS 3:23 ... " +
    "FOR IRENE ... FOR BABS ... " +
    "YOUR UIN IS %UIN% ... WRAP LIKE IT IS 1994 ... ESC TO CONTINUE ...      ";

  var SCROLL = OUR_TEXT;
  var sx = W;

  // word-triggered effects. Each trigger knows its whole word span so the
  // word itself can act (vibrate, swell, grow a mast) before it fires.
  // v1.5: 'fired' became a phase machine -
  //   burst: idle -> armed (S visible: vibrate+swell) -> ohno (S at centre:
  //          "oh no!" plays) -> popped (POP, explosion, smouldering hole)
  //   rings: idle -> rising (mast grows behind the word) -> live (full height
  //          at centre: beacon rings + transmit ping, then pulses on its way)
  var TRIGGERS = { 'SHOOTS': 'burst', 'TRANSMITS': 'rings' };
  var triggers = [];   // {start, end, center, effect, phase, t0, popX, ...}

  function buildScroll() {
    var user = (cfg.userText || '').trim();
    SCROLL = (user ? user.toUpperCase() + '  -  ' : '') +
             OUR_TEXT.replace('%UIN%', cfg.uin || '???');
    triggers = [];
    Object.keys(TRIGGERS).forEach(function (word) {
      var from = 0, idx;
      while ((idx = SCROLL.indexOf(word, from)) !== -1) {
        triggers.push({ start: idx, end: idx + word.length,
                        center: idx + word.length / 2, effect: TRIGGERS[word], fired: false,
                        phase: 'idle', t0: 0, popX: 0, hx: 0, hy: 0, remain: 0,
                        towerX: 0, towerBase: 0, towerH: 0, lastPulse: 0, swell: 1 });
        from = idx + word.length;
      }
    });
    sx = W;
  }
  buildScroll();

  // ---- particles ----
  var parts = [];   // {x,y,vx,vy,life,max,size,hue,sat,trail,px,py}
  var rings = [];   // {x,y,r,max,life}
  var flash = 0, flashX = 0, flashY = 0;

  // the big one: fiery debris, ember trails, a white-hot core flash
  // v1.5: thrown farther and wider (avid: "flaming debris thrown far and
  // wide"), and purely visual now - the POP sound fires from the sequence.
  function megaBurst(px, py) {
    flash = 1; flashX = px; flashY = py;
    for (var i = 0; i < 140; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = 1.4 + Math.random() * 6.2;
      var fiery = Math.random() < 0.75;
      parts.push({
        x: px, y: py, px: px, py: py,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.9,
        life: 0, max: 34 + Math.random() * 40,
        size: fiery ? (1 + Math.random() * 2.4) : (2.2 + Math.random() * 2.4),
        hue: fiery ? (18 + Math.random() * 40) : (Math.random() * 360),
        sat: fiery ? 100 : 90,
        trail: Math.random() < 0.22
      });
    }
  }
  // v1.5: follow=true makes the set ride along with the scroller, so the
  // mast's beacon rings stay concentric on its antenna as it travels.
  function ringSet(px, py, follow) {
    for (var i = 0; i < 4; i++) rings.push({ x: px, y: py, r: 4 + i * 3, max: 90, life: -i * 7,
                                             vx: follow ? -SCROLL_SPEED : 0 });
  }

  // ---- v1.5 smoke: the smouldering hole SHOOTS leaves behind ----
  // Smoke rides along with the scroller (the air moves with the text), rises,
  // slows, fattens and fades. The scroller's wave is treated as an air current:
  // its vertical motion at each particle's x nudges the smoke, so the plume
  // heaves with the bounce instead of ignoring it.
  var smoke = [];   // {x,y,vx,vy,life,max,r,seed}
  function waveY(px) { return H - 30 + Math.sin((px / 42) + t / 9) * 11; }
  function waveVel(px) { return Math.cos((px / 42) + t / 9) * 11 / 9; }   // d/dt of waveY, per frame

  function smoulder(tr, hx) {
    var hy = waveY(hx) - 6;
    var vyHole = tr.hy ? hy - tr.hy : 0;             // how the hole itself moved this frame
    tr.hx = hx; tr.hy = hy;
    tr.remain = Math.max(0, Math.min(1, hx / tr.popX));  // 1 at the pop -> 0 at the far side
    // emission fades with the journey: thick at first, gone by the edge
    var n = 0;
    if (Math.random() < tr.remain * 1.8) n++;
    if (Math.random() < tr.remain * 0.9) n++;
    for (var i = 0; i < n && smoke.length < 200; i++) {
      smoke.push({
        x: hx + (Math.random() - 0.5) * 16, y: hy + (Math.random() - 0.5) * 4,
        vx: -SCROLL_SPEED * (0.86 + Math.random() * 0.12) + (Math.random() - 0.5) * 0.4,
        vy: -(0.35 + Math.random() * 0.6) + vyHole * 0.7,
        life: 0, max: 70 + Math.random() * 80, r: 1.6 + Math.random() * 2.6,
        seed: Math.random() * 6.283
      });
    }
    // the odd ember still spitting out of the hole
    if (Math.random() < tr.remain * 0.3) {
      parts.push({ x: hx + (Math.random() - 0.5) * 12, y: hy, px: hx, py: hy,
        vx: -SCROLL_SPEED + (Math.random() - 0.5) * 1.2, vy: -(1.2 + Math.random() * 1.8),
        life: 0, max: 18 + Math.random() * 18, size: 1 + Math.random() * 1.2,
        hue: 14 + Math.random() * 30, sat: 100, trail: true });
    }
  }

  // ---- v1.5 the TRANSMITS mast: a lattice radio tower behind the word ----
  function drawTower(tr) {
    var bx = tr.towerX, by = tr.towerBase, h = tr.towerH;
    if (h < 2) return;
    var full = Math.min(1, h / TOWER_H), wBase = 16, wTop = 3;
    x.strokeStyle = 'rgba(150,185,210,' + (0.35 + 0.45 * full) + ')';
    x.lineWidth = 1;
    x.beginPath();
    x.moveTo(bx - wBase / 2, by); x.lineTo(bx - wTop / 2, by - h);      // legs
    x.moveTo(bx + wBase / 2, by); x.lineTo(bx + wTop / 2, by - h);
    for (var yy = 0; yy < h; yy += 11) {                                  // cross braces
      var y1 = Math.min(h, yy + 11);
      var w0 = wBase + (wTop - wBase) * (yy / TOWER_H), w1 = wBase + (wTop - wBase) * (y1 / TOWER_H);
      x.moveTo(bx - w0 / 2, by - yy); x.lineTo(bx + w1 / 2, by - y1);
      x.moveTo(bx + w0 / 2, by - yy); x.lineTo(bx - w1 / 2, by - y1);
    }
    x.stroke();
    if (full >= 1) {                                                      // antenna + beacon
      x.beginPath(); x.moveTo(bx, by - h); x.lineTo(bx, by - h - 10); x.stroke();
      var blink = beaconOn() ? 1 : 0.15;                              // v1.5: blinks A-V-I-D-U-S in Morse
      x.fillStyle = 'rgba(255,60,60,' + blink + ')';
      x.fillRect(bx - 1.5, by - h - 13, 3, 3);
    }
  }

  // ======================================================================
  // v1.5 TIER 2+3 - deep space, the fleet, the vectors, chrome, the secrets
  // ======================================================================
  // Everything here is drawn BEHIND the title and the scroller, except the
  // near ring / limb of a GIANT planet, which passes IN FRONT of the title
  // (see drawPlanetFront). All original: generic craft, real planets and
  // real satellites, a dodecahedron. No branded ships, no film ships.

  // ---- nebulae: colour clouds with filaments. (Tier 2's were too faint
  //      to survive the scanlines - avid never saw them. Fixed.) ----
  var nebulae = [
    { x: 140, y: 120, r: 170, hue: 268, a: 0.24, dx: 0.011, dy: 0.007, ph: 0.0 },
    { x: 470, y: 250, r: 190, hue: 182, a: 0.19, dx: -0.009, dy: 0.010, ph: 2.1 },
    { x: 330, y: 60,  r: 140, hue: 28,  a: 0.16, dx: 0.007, dy: -0.006, ph: 4.2 }
  ];
  function drawNebulae() {
    for (var i = 0; i < nebulae.length; i++) {
      var n = nebulae[i];
      var nx = n.x + Math.sin(t * n.dx + n.ph) * 40, ny = n.y + Math.cos(t * n.dy + n.ph) * 24;
      var a = n.a * (1 + energyN * 0.5);
      var g = x.createRadialGradient(nx, ny, 0, nx, ny, n.r);
      g.addColorStop(0, 'hsla(' + n.hue + ',85%,58%,' + a + ')');
      g.addColorStop(0.55, 'hsla(' + n.hue + ',85%,45%,' + a * 0.35 + ')');
      g.addColorStop(1, 'hsla(' + n.hue + ',80%,40%,0)');
      x.fillStyle = g; x.fillRect(nx - n.r, ny - n.r, n.r * 2, n.r * 2);
      for (var f = 0; f < 3; f++) {                                                             // filaments
        var fa = n.ph + f * 2.1 + t * 0.002, fr = n.r * 0.45;
        var fx = nx + Math.cos(fa) * n.r * 0.55, fy = ny + Math.sin(fa) * n.r * 0.35;
        var fg = x.createRadialGradient(fx, fy, 0, fx, fy, fr);
        fg.addColorStop(0, 'hsla(' + (n.hue + 18) + ',90%,65%,' + a * 0.7 + ')');
        fg.addColorStop(1, 'hsla(' + (n.hue + 18) + ',90%,50%,0)');
        x.fillStyle = fg; x.fillRect(fx - fr, fy - fr, fr * 2, fr * 2);
      }
    }
  }

  // ---- comets ----
  var comet = null;
  function spawnComet() {
    var fromRight = Math.random() < 0.5;
    comet = { x: fromRight ? W + 30 : -30, y: 20 + Math.random() * 140,
              vx: (fromRight ? -1 : 1) * (2.6 + Math.random() * 1.6), vy: 0.9 + Math.random() * 0.9,
              len: 60 + Math.random() * 50 };
  }
  function drawComet() {
    if (!comet) return;
    comet.x += comet.vx; comet.y += comet.vy;
    var tx = comet.x - comet.vx * comet.len / 3, ty = comet.y - comet.vy * comet.len / 3;
    var g = x.createLinearGradient(comet.x, comet.y, tx, ty);
    g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(160,200,255,0)');
    x.strokeStyle = g; x.lineWidth = 2;
    x.beginPath(); x.moveTo(comet.x, comet.y); x.lineTo(tx, ty); x.stroke();
    var h = x.createRadialGradient(comet.x, comet.y, 0, comet.x, comet.y, 6);
    h.addColorStop(0, 'rgba(255,255,255,1)'); h.addColorStop(1, 'rgba(200,230,255,0)');
    x.fillStyle = h; x.beginPath(); x.arc(comet.x, comet.y, 6, 0, Math.PI * 2); x.fill();
    if (comet.x < -80 || comet.x > W + 80 || comet.y > H + 40) comet = null;
  }

  // ---- planets. Small ones spin (craters and storms slide across the face);
  //      giants are ominous: Saturn's near ring and Jupiter's limb pass IN
  //      FRONT of the title, so MESSAGES sits between the ring and the planet.
  function craters(n, scars) {
    var f = [];
    for (var i = 0; i < n; i++) f.push({ type: 'crater', lat: (Math.random() - 0.5) * 2.2, lon: Math.random() * 6.28, r: 0.05 + Math.random() * 0.11 });
    for (var j = 0; j < (scars || 0); j++) f.push({ type: 'scar', lat: (Math.random() - 0.5) * 1.8, lon: Math.random() * 6.28, r: 0.18 + Math.random() * 0.14, ang: (Math.random() - 0.5) * 1.2 });
    return f;
  }
  var PLANETS = [
    { type: 'saturn', r: 56, hi: '#f3e2b0', lo: '#8a6a3a', rings: true, spin: 0.004,
      bands: [[-0.55, 0.12, 'rgba(120,80,40,.28)'], [-0.2, 0.08, 'rgba(255,235,190,.22)'], [0.15, 0.14, 'rgba(120,80,40,.24)'], [0.5, 0.1, 'rgba(255,235,190,.18)']],
      feat: [{ type: 'storm', lat: -0.35, lon: 1, r: 0.09, col: 'rgba(255,245,220,.35)' }] },
    { type: 'rust', r: 34, hi: '#f0a070', lo: '#6a2410', spin: 0.006,
      bands: [[-0.5, 0.15, 'rgba(255,200,150,.25)'], [-0.1, 0.1, 'rgba(90,30,10,.35)'], [0.25, 0.18, 'rgba(255,190,140,.2)']],
      feat: [{ type: 'storm', lat: 0.3, lon: 0, r: 0.2, col: 'rgba(200,60,40,.7)' }, { type: 'storm', lat: -0.5, lon: 2.5, r: 0.08, col: 'rgba(255,220,200,.5)' }] },
    { type: 'ice', r: 15, hi: '#e8f6ff', lo: '#4a7ab0', spin: 0.012, feat: craters(9, 0) },
    { type: 'ochre', r: 24, hi: '#e6c88a', lo: '#6e4a20', moon: true, spin: 0.008,
      bands: [[-0.35, 0.2, 'rgba(60,40,20,.3)'], [0.2, 0.12, 'rgba(255,230,180,.18)']], feat: craters(7, 3) },
    { type: 'saturnGiant', giant: true, r: 190, hi: '#b8a070', lo: '#2e2010', rings: true, ringA: 0.75, spin: 0.0025,
      bands: [[-0.6, 0.08, 'rgba(90,60,30,.35)'], [-0.35, 0.05, 'rgba(230,210,170,.18)'], [-0.15, 0.1, 'rgba(90,60,30,.3)'], [0.1, 0.06, 'rgba(230,210,170,.15)'], [0.3, 0.12, 'rgba(80,50,25,.3)']],
      feat: [{ type: 'storm', lat: -0.45, lon: 0.5, r: 0.05, col: 'rgba(255,245,220,.3)' }] },
    { type: 'jupiter', giant: true, r: 210, hi: '#c9a882', lo: '#3a2416', spin: 0.003,
      bands: [[-0.7, 0.06, 'rgba(120,80,50,.4)'], [-0.5, 0.1, 'rgba(240,220,190,.2)'], [-0.3, 0.08, 'rgba(110,60,30,.45)'], [-0.1, 0.12, 'rgba(230,205,170,.22)'], [0.08, 0.07, 'rgba(120,70,40,.4)'], [0.28, 0.1, 'rgba(235,215,185,.2)'], [0.5, 0.09, 'rgba(100,60,35,.4)']],
      feat: [{ type: 'storm', lat: 0.3, lon: 0, r: 0.16, col: 'rgba(190,70,45,.75)' }, { type: 'storm', lat: -0.42, lon: 2, r: 0.045, col: 'rgba(250,240,225,.5)' }, { type: 'storm', lat: -0.42, lon: 3.2, r: 0.04, col: 'rgba(250,240,225,.5)' }, { type: 'storm', lat: 0.6, lon: 4.5, r: 0.05, col: 'rgba(250,240,225,.45)' }] }
  ];
  var planet = null;
  function spawnPlanet(type) {
    var def = null, smalls = [];
    for (var i = 0; i < PLANETS.length; i++) { if (PLANETS[i].type === type) def = PLANETS[i]; if (!PLANETS[i].giant) smalls.push(PLANETS[i]); }
    if (!def) def = smalls[Math.floor(Math.random() * smalls.length)];
    planet = def.giant
      ? { def: def, x: W + def.r * 2.3, y: 250, vx: -0.34, spin: Math.random() * 6.28, ma: 0 }
      : { def: def, x: W + def.r * 2.4, y: 150 + Math.random() * 70, vx: -(0.28 + Math.random() * 0.14), spin: 0, ma: Math.random() * 6.28 };
  }
  // below=true views the ring plane from slightly underneath, so the NEAR
  // half passes above the planet's centre - that is how a giant's ring gets
  // to cross in front of the title with the body behind it.
  function drawRings(px, py, r, back, alpha, below) {
    x.save(); x.translate(px, py); x.rotate(-0.30);
    var far = below ? !back : back;

  // ---- the dogfight: saucers come in and HOVER mid-screen; our fighters
  //      come in behind them and shoot them down. Explosions and smoke hang
  //      where they die until the battle is won. Humans win. Every time. ----
  var fight = null;
  function spawnFight() {
    fight = { fighters: [], foos: [], bolts: [], age: 0 };
    var baseY = 110 + Math.random() * 110;
    for (var i = 0; i < 3; i++) {
      var f = spawnCraft(Math.random() < 0.7 ? 'foo' : 'cigar');
      f.x = W + 30 + i * 50; f.y = baseY + (i - 1) * 42; f.vx = -1.5; f.stopX = 330 + i * 60; f.s = 1; f.a = 1; f.wobble = 1;
      fight.foos.push(f);
    }
    for (var j = 0; j < 2; j++) {
      var s = spawnCraft('fighter'); s.x = -40 - j * 36; s.y = baseY + (j ? 30 : -30); s.dir = 1; s.vx = 2.0; s.s = 1; s.a = 1;
      s.cool = 30 + j * 11; fight.fighters.push(s);
    }
  }
  function stepFight() {
    if (!fight) return;
    fight.age++;
    var f, k, alive = [];
    for (k = 0; k < fight.foos.length; k++) if (fight.foos[k].alive) alive.push(fight.foos[k]);
    var dodge = Math.max(0, 1 - fight.age / 520);                                              // they dodge less as the fight wears on
    for (k = 0; k < fight.foos.length; k++) {
      f = fight.foos[k]; if (!f.alive) continue;
      if (f.x > f.stopX) f.x += f.vx; else { f.vx = 0; f.x += Math.sin(t / 13 + f.seed) * 0.35; }   // arrive, then hover
      f.y += Math.sin(t / 9 + f.seed) * 0.9;
      for (var q2 = 0; q2 < fight.bolts.length; q2++) {                                         // see a bolt coming? juke
        var bb = fight.bolts[q2];
        if (bb.x < f.x && f.x - bb.x < 60 && Math.abs(bb.y - f.y) < 14) f.y += (f.y >= bb.y ? 1.6 : -1.6) * dodge;
      }
      f.y = Math.max(50, Math.min(300, f.y));
    }
    for (k = 0; k < fight.fighters.length; k++) {
      f = fight.fighters[k];
      var tgt = null, best = 1e9;
      for (var q = 0; q < alive.length; q++) { var dd = Math.abs(alive[q].y - f.y) + Math.max(0, alive[q].x - f.x); if (dd < best) { best = dd; tgt = alive[q]; } }
      if (tgt) {
        var gap = tgt.x - f.x;
        f.vx = gap > 140 ? 2.4 : (gap < 70 ? -0.6 : 1.2);                                       // keep a firing distance, never overtake
        f.vy = Math.max(-1.6, Math.min(1.6, (tgt.y - f.y) * 0.05));
        if (--f.cool <= 0 && gap > 30 && gap < 240 && Math.abs(tgt.y - f.y) < 16) {
          f.cool = 26 + Math.random() * 14;
          fight.bolts.push({ x: f.x + 16, y: f.y, vx: 7, vy: (tgt.y - f.y) * 0.03, life: 0, home: fight.age > 520 });
          fxZap();
        }
      } else { f.vx = Math.min(4.5, f.vx + 0.08); f.vy *= 0.9; }
    }
    for (k = fight.bolts.length - 1; k >= 0; k--) {
      var b = fight.bolts[k]; b.life++;
      if (b.home && alive.length) { var a0 = alive[0]; b.vy += (a0.y - b.y) * 0.02; }
      b.x += b.vx; b.y += b.vy;
      x.strokeStyle = 'rgba(80,240,255,.95)'; x.lineWidth = 1.5;
      x.beginPath(); x.moveTo(b.x - 10, b.y); x.lineTo(b.x, b.y); x.stroke();
      var hit = false;
      for (var m = 0; m < alive.length; m++) {
        var fo = alive[m];
        if (fo.alive && Math.abs(fo.x - b.x) < 12 && Math.abs(fo.y - b.y) < 9) { fooPop(fo); hit = true; break; }
      }

  function killAllFoos() { for (var i = 0; i < craft.length; i++) if ((craft[i].kind === 'foo' || craft[i].kind === 'cigar') && craft[i].alive) fooPop(craft[i]); }

  // ---- a laser zap for the dogfight: 45ms falling sine with a little hiss ----
  function renderZap(sr) {
    var n = Math.floor(sr * 0.045), out = new Float32Array(n), ph = 0;
    for (var i = 0; i < n; i++) {
      var tt = i / sr, f = 2200 * Math.pow(500 / 2200, tt / 0.045);
      ph += 2 * Math.PI * f / sr;

  // ---- the Morse beacon: the mast blinks A-V-I-D-U-S ----
  var MORSE = { A: '.-', V: '...-', I: '..', D: '-..', U: '..-', S: '...' };
  var beaconSeq = (function () {
    var seq = [], word = 'AVIDUS';
    for (var i = 0; i < word.length; i++) {

      seq.push(0, 0);

  })();

  // ---- the vectors: a wireframe dodecahedron tumbling behind the title ----
  var PHI = (1 + Math.sqrt(5)) / 2, dodV = [], dodE = [];
  (function () {
    var i, j, s = [-1, 1];
    for (i = 0; i < 2; i++) for (j = 0; j < 2; j++) for (var k = 0; k < 2; k++) dodV.push([s[i], s[j], s[k]]);
    for (i = 0; i < 2; i++) for (j = 0; j < 2; j++) {
      dodV.push([0, s[i] / PHI, s[j] * PHI]); dodV.push([s[i] / PHI, s[j] * PHI, 0]); dodV.push([s[i] * PHI, 0, s[j] / PHI]);
    }

    for (i = 0; i < dodV.length; i++) for (j = i + 1; j < dodV.length; j++) {
      var d = Math.sqrt(Math.pow(dodV[i][0] - dodV[j][0], 2) + Math.pow(dodV[i][1] - dodV[j][1], 2) + Math.pow(dodV[i][2] - dodV[j][2], 2));

    var rx = t * 0.008, ry = t * 0.012, rz = t * 0.003, pts = [];

      c = Math.cos(rx); s = Math.sin(rx); y2 = Y * c - Z * s; z2 = Y * s + Z * c; Y = y2; Z = z2;
      c = Math.cos(ry); s = Math.sin(ry); x2 = X * c + Z * s; z2 = -X * s + Z * c; X = x2; Z = z2;
      c = Math.cos(rz); s = Math.sin(rz); x2 = X * c - Y * s; y2 = X * s + Y * c; X = x2; Y = y2;

  function chromeGradient(ctx2) {

  // ---- the scheduler: the odd one, not all. Cooldowns keep the ISS rare
  //      (two or three a track, one at a time) and giants rarer still. ----
  var nextEvent = 200, cool = { iss: 0, sat: 0, giant: 1200, planet: 0, fight: 400 };
  function schedule() {
    if (t < nextEvent) return;
    nextEvent = t + 240 + Math.random() * 380;
    var r = Math.random();
    if (!planet && t > cool.giant && r < 0.10) { spawnPlanet(Math.random() < 0.5 ? 'saturnGiant' : 'jupiter'); cool.giant = t + 7000; cool.planet = t + 3000; }
    else if (!planet && t > cool.planet && r < 0.30) { spawnPlanet(); cool.planet = t + 1800; }
    else if (!fight && t > cool.fight && r < 0.45) { spawnFight(); cool.fight = t + 3200; }
    else if (!hasCraft('iss') && t > cool.iss && r < 0.55) { spawnCraft('iss'); cool.iss = t + 4200; }
    else if (!hasCraft('sat') && t > cool.sat && r < 0.68) { spawnCraft('sat'); cool.sat = t + 1500; }
    else if (craft.length < 3 && r < 0.88) spawnCraft(['cruiser', 'fighter', 'rock', 'foo', 'cigar', 'rock'][Math.floor(Math.random() * 6)]);
    else if (!comet) spawnComet();
  }

  // ---- audio: element + analyser with REAL sub-bass and auto-gain ----
  // fftSize 1024 → ~43Hz per bin, so the DnB sub actually lands in our
  // bass read. Eight log-spaced bands drive the letter EQ; per-band
  // auto-gain keeps every reaction using its full visual range.
  var actx = null, analyser = null, fdata = null;
  var BANDS = [[1, 4], [4, 7], [7, 13], [13, 25], [25, 49], [49, 97], [97, 193], [193, 385]];
  var band = [0, 0, 0, 0, 0, 0, 0, 0];        // normalised 0..1 after AGC
  var bmax = [.06, .06, .06, .06, .06, .06, .06, .06];
  var bassN = 0, energyN = 0, kick = 0, bassAvg = 0.0001, emax = .06;

  // v1.5: the context is shared with the SFX, so "wired" (not "actx exists")
  // is the guard - otherwise a POP before the music starts would create the
  // context first and the analyser would never get built.
  var wired = false;
  function ensureCtx() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function wireAudio() {
    if (wired) return;
    try {
      if (!ensureCtx()) return;
      var src = actx.createMediaElementSource(tune);
      analyser = actx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.72;
      src.connect(analyser); analyser.connect(actx.destination);
      fdata = new Uint8Array(analyser.frequencyBinCount);
      wired = true;
    } catch (e) { analyser = null; }
  }

  function readAudio() {
    if (!analyser || tune.paused) {
      for (var z = 0; z < 8; z++) band[z] *= 0.9;
      bassN *= 0.9; energyN *= 0.9; kick *= 0.9;
      return;
    }
    analyser.getByteFrequencyData(fdata);
    var e = 0;
    for (var i = 0; i < 8; i++) {
      var lo = BANDS[i][0], hi = BANDS[i][1], sum = 0;
      for (var j = lo; j < hi; j++) sum += fdata[j];
      var lvl = sum / (hi - lo) / 255;
      bmax[i] = Math.max(bmax[i] * 0.9965, lvl, 0.06);   // slow-decay AGC
      band[i] = Math.min(1, lvl / bmax[i]);
    }
    for (var k2 = 0; k2 < fdata.length; k2++) e += fdata[k2];
    var er = e / fdata.length / 255;
    emax = Math.max(emax * 0.9965, er, 0.06);
    energyN = Math.min(1, er / emax);
    bassN = (band[0] * 0.65 + band[1] * 0.35);
    bassAvg = bassAvg * 0.95 + bassN * 0.05;
    if (bassN > bassAvg * 1.25 && bassN > 0.45 && kick < 0.35) kick = 1;
    kick *= 0.86;
  }

  // ---- v1.5 original SFX: POP (Lemmings-style) + TRANSMIT ping ----
  // ---- v1.5 original SFX renderers (pure functions of sample rate) ----
  // Nothing sampled. Each returns a mono Float32Array, peak-normalised,
  // lightly 8-bit crushed and band-limited so it sits with the oh-no's grit.
  function crushAndLimit(out, sr) {
    var peak = 0;
    for (var i = 0; i < out.length; i++) peak = Math.max(peak, Math.abs(out[i]));
    var g = peak > 0 ? 0.9 / peak : 1;
    var lp = 0, a = Math.exp(-2 * Math.PI * 4200 / sr);        // one-pole lowpass ~4.2kHz
    for (var j = 0; j < out.length; j++) {
      var v = out[j] * g;
      v = Math.round(v * 127) / 127;                            // 8-bit steps
      lp = a * lp + (1 - a) * v;
      out[j] = lp;
    }
    var fade = Math.floor(sr * 0.015);                          // land on zero: no click at the end
    for (var k = 0; k < fade && k < out.length; k++) out[out.length - 1 - k] *= k / fade;
    return out;
  }

  // Lemmings-style POP: a bright skin-split click, then a fast falling
  // "bloop" (900Hz -> 110Hz in 70ms). Total ~150ms. A pop, not a boom.
  function renderPop(sr) {
    var n = Math.floor(sr * 0.15), out = new Float32Array(n), ph = 0;
    for (var i = 0; i < n; i++) {
      var tt = i / sr;
      // click: 12ms of noise with a 3ms decay
      var click = tt < 0.012 ? (Math.random() * 2 - 1) * Math.exp(-tt / 0.003) * 0.9 : 0;
      // bloop: exponential sweep, 1ms attack, 35ms decay
      var f = 900 * Math.pow(110 / 900, Math.min(1, tt / 0.07));
      ph += 2 * Math.PI * f / sr;
      var env = Math.min(1, tt / 0.001) * Math.exp(-tt / 0.035);
      var bloop = (Math.sin(ph) + 0.35 * Math.sin(2 * ph)) * env;
      out[i] = click + bloop;
    }
    return crushAndLimit(out, sr);
  }

  // TRANSMIT ping: a sonar-style chirp (1400Hz -> 950Hz in 60ms) that rings
  // out with a 14Hz tremolo "buzz", then two fading echoes. ~1.1s.
  function renderPing(sr) {
    var n = Math.floor(sr * 1.1), out = new Float32Array(n);
    var hits = [[0, 1], [0.28, 0.45], [0.56, 0.2]];
    for (var h = 0; h < hits.length; h++) {
      var t0 = hits[h][0], amp = hits[h][1], ph = 0, start = Math.floor(t0 * sr);
      for (var i = start; i < n; i++) {
        var tt = (i - start) / sr;
        var f = 1400 * Math.pow(950 / 1400, Math.min(1, tt / 0.06));
        ph += 2 * Math.PI * f / sr;
        var env = Math.min(1, tt / 0.004) * Math.exp(-tt / 0.18);
        var trem = 1 - 0.5 * (0.5 + 0.5 * Math.sin(2 * Math.PI * 14 * tt));
        out[i] += (Math.sin(ph) + 0.25 * Math.sin(3 * ph)) * env * trem * amp;
      }
    }
    return crushAndLimit(out, sr);
  }

  // buffers are rendered once at the context's own sample rate
  var sfx = { pop: null, ping: null };
  function sfxBuf(name, render) {
    if (!ensureCtx()) return null;
    if (!sfx[name]) {
      var data = render(actx.sampleRate);
      var b = actx.createBuffer(1, data.length, actx.sampleRate);
      b.getChannelData(0).set(data);
      sfx[name] = b;
    }
    return sfx[name];
  }

      var s = actx.createBufferSource(), g = actx.createGain();
      s.buffer = buf; g.gain.value = Math.max(0, Math.min(1, vol));
      s.connect(g); g.connect(actx.destination); s.start();
    } catch (e) {}
  }
  function trackVol() { return Math.max(0, Math.min(1, cfg.volume / 100)); }
  function fxOhNo() {
    try { ohno.volume = trackVol() * OHNO_MIX; ohno.currentTime = 0;
          var p = ohno.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  function fxPop()  { playBuf(sfxBuf('pop', renderPop), trackVol() * POP_MIX); }
  function fxPing() { playBuf(sfxBuf('ping', renderPing), trackVol() * PING_MIX); }

  // ---- RETIRED v1.5 (kept, unused - dead code, avid's call to delete) ----
  // The v1.4 synthesized "uh-oh...BOOM" fell flat: a Charlie Brown
  // sound and a boom where a POP belonged. Superseded by the oh-no file
  // + fxPop above. Nothing calls this any more.
  // ---- tiny synthesized FX: an original "uh-oh" homage + boom ----
  // Nothing sampled, nothing ripped — two square-wave blips falling a
  // minor third, then a filtered noise boom with a sub thump underneath.
  function fxUhOhBoom() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var now = actx.currentTime;
      function blip(freq, at, dur) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.setValueAtTime(freq, now + at);
        o.frequency.exponentialRampToValueAtTime(freq * 0.92, now + at + dur);
        g.gain.setValueAtTime(0.0001, now + at);
        g.gain.exponentialRampToValueAtTime(0.22, now + at + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, now + at + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(now + at); o.stop(now + at + dur + 0.02);
      }
      blip(392, 0.00, 0.11);   // "uh"
      blip(294, 0.13, 0.15);   // "oh" — down a minor third and a bit
      // boom at 0.34s: noise burst through a falling lowpass + 52Hz thump
      var len = Math.floor(actx.sampleRate * 0.55);
      var buf = actx.createBuffer(1, len, actx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
      var nsrc = actx.createBufferSource(); nsrc.buffer = buf;
      var lp = actx.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(900, now + 0.34);
      lp.frequency.exponentialRampToValueAtTime(90, now + 0.80);
      var ng = actx.createGain();
      ng.gain.setValueAtTime(0.5, now + 0.34);
      ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.92);
      nsrc.connect(lp); lp.connect(ng); ng.connect(actx.destination);
      nsrc.start(now + 0.34);
      var th = actx.createOscillator(), tg = actx.createGain();
      th.frequency.setValueAtTime(52, now + 0.34);
      tg.gain.setValueAtTime(0.4, now + 0.34);
      tg.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
      th.connect(tg); tg.connect(actx.destination);
      th.start(now + 0.34); th.stop(now + 0.9);
    } catch (e) {}
  }

  function applyMusic() {
    tune.volume = Math.max(0, Math.min(1, cfg.volume / 100));
    if (cfg.music) { wireAudio(); var p = tune.play(); if (p && p.catch) p.catch(function () {}); }
    else tune.pause();
    document.getElementById('musicBtn').textContent = 'MUSIC: ' + (cfg.music ? 'ON' : 'OFF');
  }

  // ---- drawing ----
  // copper bars now breathe AND fatten with the sub
  // v1.5: a wider swing (0.45x..2.35x), a snap on every kick, and a brighter
  // core when the bass leans in - avid wanted them to FEEL the bassline.
  function copper(y0, baseH, hue) {
    var h = Math.round(baseH * (0.45 + bassN * 1.9 + kick * 0.5 + copperFlash * 1.2));
    var yy = y0 - (h - baseH) / 2;
    for (var i = 0; i < h; i++) {
      var f = Math.sin((i / h) * Math.PI);
      x.fillStyle = 'hsl(' + hue + ',100%,' + Math.min(70, 8 + f * (26 + bassN * 58 + kick * 10) + copperFlash * 40) + '%)';
      x.fillRect(0, yy + i, W, 1);
    }
  }

  // classic LED EQ column: green shaft, amber shoulder, red crown
  function ledColumn(cx2, baseY, wdt, maxH, lvl) {
    var segs = 11, on = Math.round(lvl * segs);
    for (var s2 = 0; s2 < segs; s2++) {
      var frac = s2 / (segs - 1);
      var col = frac < 0.55 ? '90,255,120' : (frac < 0.82 ? '255,196,60' : '255,70,60');
      var alpha = s2 < on ? 0.42 : 0.07;
      var segH = (maxH / segs) - 2;
      x.fillStyle = 'rgba(' + col + ',' + alpha + ')';
      x.fillRect(cx2 - wdt / 2, baseY - (s2 + 1) * (maxH / segs), wdt, segH);
    }
  }

  function frame() {
    t++;
    readAudio();
    x.fillStyle = '#000'; x.fillRect(0, 0, W, H);

    if (kickHold > 0) { kick = 1; kickHold--; }          // v1.5: a forced hyperspace run (CALIX)
    copperFlash *= 0.92;
    schedule();
    drawNebulae();

    // starfield: hits warp speed with the track
    // v1.5: and JOLTS into hyperspace on every kick - stars streak for a
    // dozen frames, the ship stuttering into warp with the sub.
    var speed = 1 + energyN * 3.2 + kick * 7;
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      st.x -= st.s * speed;
      if (st.x < 0) { st.x = W; st.y = Math.random() * H; }
      x.fillStyle = 'rgba(255,255,255,' + (0.25 + st.s / 3) + ')';
      x.fillRect(st.x, st.y, st.s > 1.4 ? 2 : 1, st.s > 1.4 ? 2 : 1);
      if (kick > 0.12) {
        x.strokeStyle = 'rgba(255,255,255,' + ((0.2 + st.s / 3) * kick) + ')';
        x.lineWidth = st.s > 1.4 ? 2 : 1;
        x.beginPath(); x.moveTo(st.x, st.y); x.lineTo(st.x + st.s * kick * 26, st.y); x.stroke();
      }
    }
    drawComet();
    drawPlanet();
    drawDodeca(W / 2, 122, 78);
    stepFleet();

    copper(30 + Math.sin(t / 26) * 10, 26, 28);
    copper(H - 88 + Math.sin(t / 22 + 1) * 10, 22, 150);

    snapCtx.clearRect(0, 0, W, H); snapCtx.drawImage(c, 0, 0);   // v1.5: the scene so far, for the chrome reflections

    // ---- MESSAGES as a living 8-band EQ ----
    // M carries the sub, the final S rings the hats. Each letter has an
    // old-school LED column behind it and fattens with its own band.
    var title = 'MESSAGES';
    var kscale = 1 + kick * 0.10;
    x.save();
    x.translate(W / 2, 150); x.scale(kscale, kscale); x.translate(-W / 2, -150);
    x.font = 'bold 54px "DejaVu Sans", sans-serif';
    x.textAlign = 'center';
    var tw = x.measureText(title).width, cx = W / 2 - tw / 2;
    var letterX = [];
    for (var j = 0; j < title.length; j++) {
      var cw = x.measureText(title[j]).width;
      letterX.push({ c: cx + cw / 2, w: cw });
      cx += cw;
    }
    // LED columns first, behind the letters
    for (var j2 = 0; j2 < 8; j2++) {
      ledColumn(letterX[j2].c, 176, letterX[j2].w * 0.72, 92, band[j2]);
    }
    // then the letters, each scaled by its own band
    // v1.5: chrome, with the scene reflected in it (see drawTitleLetters).
    // v1.4's inline green gradient is retired - it never rendered (wrong
    // coordinate space, came out solid white).
    x.restore();                                   // leave the kscale transform; the helpers apply their own
    drawTitleLetters(x, title, letterX, kscale, 'chrome');
    reflectTitle(title, letterX, kscale);
    x.save();                                      // re-enter it for the rest of the title block
    x.translate(W / 2, 150); x.scale(kscale, kscale); x.translate(-W / 2, -150);
    for (var j3 = 0; j3 < 0; j3++) {
    }
    x.restore();

    x.font = 'bold 20px "DejaVu Sans Mono", monospace';
    x.textAlign = 'center';
    x.fillStyle = 'hsl(140,100%,' + (48 + kick * 34) + '%)';
    x.fillText('F O R   L I N U X', W / 2, 208);

    x.font = '12px "DejaVu Sans Mono", monospace';
    x.fillStyle = 'rgba(180,240,200,.75)';
    x.fillText('a v i d u s S o f t w a r e   ///   avid & calix', W / 2, 234);

    drawPlanetFront();                             // v1.5: a giant's near ring crosses IN FRONT of the title

    // ---- scroller: bounce, colour cycle, and the SHOOTS / TRANSMITS builds ----
    x.font = 'bold 17px "DejaVu Sans Mono", monospace';
    x.textAlign = 'left';
    var chW = x.measureText('M').width;
    var nowMs = performance.now();

    // v1.5 sequence engine. avid's spec, in order:
    //   SHOOTS - the instant the S shows at the right edge the word vibrates,
    //   faster and faster, swelling like a lemming's head, until the S hits
    //   dead centre: "oh no!" plays, then POP, the word explodes, flaming
    //   debris flies, and for the rest of its journey a smouldering, smoke-
    //   filled hole rides where the word was - fully gone by the far side.
    //   TRANSMITS - a radio mast grows up behind the word, full height by
    //   centre, then fires the beacon rings + transmit ping and keeps pulsing.
    var jit = {}, hide = {}, swellOf = {}, swellCx = {};
    for (var ti = 0; ti < triggers.length; ti++) {
      var tr = triggers[ti];
      var sX = sx + tr.start * chW + chW / 2;                // centre of the first letter
      var wcx = sx + tr.center * chW;                        // centre of the word
      var dS = Math.max(0, Math.min(1, (sX - W / 2) / (W / 2)));    // 1 at right edge -> 0 at centre (the S)
      var dW = Math.max(0, Math.min(1, (wcx - W / 2) / (W / 2)));   // same, for the word's centre

      if (tr.effect === 'burst') {
        if (tr.phase === 'idle' && sX < W + chW / 2) tr.phase = 'armed';
        var sVis = wcx + (sX - wcx) * tr.swell;              // where the S actually IS once swollen
        if (tr.phase === 'armed' && sVis <= W / 2) {         // the S hits dead centre
          tr.phase = 'ohno'; tr.t0 = nowMs; fxOhNo();
        }
        if (tr.phase === 'ohno' && nowMs - tr.t0 >= OHNO_MS) {   // ...then POP
          tr.phase = 'popped'; tr.fired = true; tr.popX = Math.max(1, wcx);
          tr.hx = 0; tr.hy = 0;
          megaBurst(wcx, waveY(wcx) - 6); fxPop();
        }
        if (tr.phase === 'armed' || tr.phase === 'ohno') {
          var build = 1 - dS;                                    // 0 -> 1 across the right half
          var extra = tr.phase === 'ohno' ? Math.min(1, (nowMs - tr.t0) / OHNO_MS) : 0;
          var inten = Math.pow(build, 2) * 3.6 + extra * 2.6;    // shakes harder, then harder still
          var sw = 1 + build * 0.42 + extra * 0.48;              // head inflating: 1.0 -> 1.9
          for (var ci = tr.start; ci < tr.end; ci++) { jit[ci] = inten; swellOf[ci] = sw; swellCx[ci] = wcx; }
          tr.swell = sw;
        }
        if (tr.phase === 'popped') {
          for (var hi = tr.start; hi < tr.end; hi++) hide[hi] = true;
          smoulder(tr, wcx);
        }
      } else {                                                 // 'rings' -> the mast
        if (tr.phase === 'idle' && wcx < W + chW * 4) tr.phase = 'rising';
        if (tr.phase !== 'idle') {
          tr.towerX = wcx; tr.towerBase = waveY(wcx) + 6;
          tr.towerH = (tr.phase === 'rising' ? 1 - dW : 1) * TOWER_H;
          var tip = tr.towerBase - tr.towerH - 12;
          if (tr.phase === 'rising' && wcx <= W / 2) {        // full height at centre: transmit
            tr.phase = 'live'; tr.fired = true; tr.lastPulse = t;
            ringSet(wcx, tip, true); fxPing();
          }
          if (tr.phase === 'live' && t - tr.lastPulse > 95) { tr.lastPulse = t; ringSet(wcx, tip, true); }
          drawTower(tr);                                       // drawn now = behind the letters
        }
      }
    }

    for (var k = 0; k < SCROLL.length; k++) {
      if (hide[k]) continue;                                   // the hole where SHOOTS was
      var px = sx + k * chW;
      if (px < -chW * 2 || px > W + chW) continue;
      var jx = jit[k] ? (Math.random() - 0.5) * 2 * jit[k] : 0;
      var jy = jit[k] ? (Math.random() - 0.5) * 2 * jit[k] : 0;
      x.fillStyle = 'hsl(' + ((t * 2 + k * 7) % 360) + ',90%,68%)';
      if (swellOf[k] && swellOf[k] > 1.001) {
        // inflate the whole word about a pivot just under its baseline, so it
        // bloats upward and outward like a head about to go
        var pcx = swellCx[k], pcy = waveY(pcx) + 3;
        x.save();
        x.translate(pcx, pcy); x.scale(swellOf[k], swellOf[k]); x.translate(-pcx, -pcy);
        x.fillText(SCROLL[k], px + jx, waveY(px) + jy);
        x.restore();
      } else {
        x.fillText(SCROLL[k], px + jx, waveY(px) + jy);
      }
    }
    sx -= SCROLL_SPEED;
    if (sx < -SCROLL.length * chW) {
      sx = W;
      for (var tr2 = 0; tr2 < triggers.length; tr2++) {
        triggers[tr2].fired = false; triggers[tr2].phase = 'idle';
        triggers[tr2].towerH = 0; triggers[tr2].remain = 0; triggers[tr2].swell = 1;
      }
    }

    // ---- v1.5 the smouldering hole: ember glow + rising smoke ----
    for (var ti2 = 0; ti2 < triggers.length; ti2++) {
      var th = triggers[ti2];
      if (th.effect !== 'burst' || th.phase !== 'popped' || th.remain <= 0) continue;
      var gl = th.remain * (0.35 + Math.random() * 0.3);
      var eg = x.createRadialGradient(th.hx, th.hy, 0, th.hx, th.hy, 16);
      eg.addColorStop(0, 'rgba(255,120,30,' + gl + ')');
      eg.addColorStop(0.5, 'rgba(200,50,10,' + gl * 0.5 + ')');
      eg.addColorStop(1, 'rgba(120,20,0,0)');
      x.fillStyle = eg;
      x.beginPath(); x.arc(th.hx, th.hy, 16, 0, Math.PI * 2); x.fill();
      for (var em = 0; em < 5; em++) {                         // charred remnants, flickering
        var ex = th.hx - 12 + em * 6, ey2 = th.hy + 2 + Math.sin(em * 2.1) * 3;
        x.fillStyle = 'rgba(255,' + (60 + Math.floor(Math.random() * 90)) + ',20,' + th.remain * (0.4 + Math.random() * 0.6) + ')';
        x.fillRect(ex, ey2, 2, 2);
      }
    }
    for (var sm = smoke.length - 1; sm >= 0; sm--) {
      var sp = smoke[sm];
      sp.life++;
      if (sp.life > sp.max) { smoke.splice(sm, 1); continue; }
      sp.vy += (sp.world ? 0 : waveVel(sp.x) * 0.10) - 0.004;  // the wave heaves it (scroller smoke only); a little buoyancy
      sp.vx += Math.sin(t / 7 + sp.seed) * 0.03;               // turbulence
      sp.vy *= 0.985; sp.vx *= 0.995;
      sp.x += sp.vx; sp.y += sp.vy;
      sp.r += 0.07;
      var sa = (1 - sp.life / sp.max) * 0.42;
      var sg = x.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, sp.r);
      sg.addColorStop(0, 'rgba(185,185,195,' + sa + ')');
      sg.addColorStop(1, 'rgba(120,120,130,0)');
      x.fillStyle = sg;
      x.beginPath(); x.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); x.fill();
    }

    // core flash of the explosion
    if (flash > 0.03) {
      var fr = 26 + (1 - flash) * 70;
      var fg = x.createRadialGradient(flashX, flashY, 0, flashX, flashY, fr);
      fg.addColorStop(0, 'rgba(255,255,240,' + flash * 0.95 + ')');
      fg.addColorStop(0.35, 'rgba(255,190,80,' + flash * 0.6 + ')');
      fg.addColorStop(1, 'rgba(255,90,30,0)');
      x.fillStyle = fg;
      x.beginPath(); x.arc(flashX, flashY, fr, 0, Math.PI * 2); x.fill();
      flash *= 0.82;
    }

    // debris: fiery embers with trails, gravity and drag
    for (var p = parts.length - 1; p >= 0; p--) {
      var q = parts[p];
      q.life++;
      q.px = q.x; q.py = q.y;
      q.x += q.vx; q.y += q.vy;
      q.vy += 0.10; q.vx *= 0.985; q.vy *= 0.99;
      if (q.life > q.max) { parts.splice(p, 1); continue; }
      var a = 1 - q.life / q.max;
      if (q.trail) {
        x.strokeStyle = 'hsla(' + q.hue + ',' + q.sat + '%,60%,' + a * 0.7 + ')';
        x.lineWidth = q.size * 0.8;
        x.beginPath(); x.moveTo(q.px, q.py); x.lineTo(q.x, q.y); x.stroke();
      } else {
        x.fillStyle = 'hsla(' + ((q.hue + q.life * 2) % 360) + ',' + q.sat + '%,' + (66 - a * -0) + '%,' + a + ')';
        x.fillRect(q.x, q.y, q.size, q.size);
      }
    }

    // transmit rings: doubled stroke, broadcast glow
    for (var r = rings.length - 1; r >= 0; r--) {
      var g2 = rings[r];
      g2.life++;
      g2.x += g2.vx || 0;
      if (g2.life < 0) continue;
      if (g2.life > g2.max) { rings.splice(r, 1); continue; }
      var rr = g2.r + g2.life * 1.35;
      var aa = 1 - g2.life / g2.max;
      x.strokeStyle = 'rgba(85,255,170,' + aa * 0.9 + ')';
      x.lineWidth = 1.6;
      x.beginPath(); x.arc(g2.x, g2.y, rr, 0, Math.PI * 2); x.stroke();
      x.strokeStyle = 'rgba(140,230,255,' + aa * 0.4 + ')';
      x.lineWidth = 0.8;
      x.beginPath(); x.arc(g2.x, g2.y, rr * 0.86, 0, Math.PI * 2); x.stroke();
    }

    drawBigWord();                                          // v1.5: a found secret word, flashed big
    drawSecretLane();                                       // v1.5: the secret message on its own lane, once

    // scanlines over everything (v1.5: CRT mode swaps in the full tube look)
    if (crt) crtOverlay();
    else {
      x.fillStyle = 'rgba(0,0,0,.30)';
      for (var y = 0; y < H; y += 3) x.fillRect(0, y, W, 1);
    }

    requestAnimationFrame(frame);
  }
  frame();

  // ---- controls ----
  document.getElementById('musicBtn').addEventListener('click', function () {
    cfg.music = !cfg.music; applyMusic(); window.cracktroAPI.set('cracktroMusic', cfg.music);
  });
  document.getElementById('vol').addEventListener('input', function (e) {
    cfg.volume = Number(e.target.value); tune.volume = cfg.volume / 100;
    window.cracktroAPI.set('cracktroVolume', cfg.volume);
  });
  document.getElementById('fsBtn').addEventListener('click', function () {
    window.cracktroAPI.toggleFullscreen();
  });
  document.getElementById('crtBtn').addEventListener('click', function () {
    crt = !crt; applyCrt(); window.cracktroAPI.set('cracktroCrt', crt);
  });
  document.getElementById('everyLaunch').addEventListener('change', function (e) {
    window.cracktroAPI.set('cracktroEveryLaunch', !!e.target.checked);
  });

  window.addEventListener('keydown', function (e) {
    if (/^[a-zA-Z]$/.test(e.key)) {                        // v1.5: the secret words
      typed = (typed + e.key.toUpperCase()).slice(-8);
      if (typed.slice(-4) === 'AVID') secretAvid();
      else if (typed.slice(-5) === 'CALIX') secretCalix();
    }
    if (e.key === 'Escape' || e.key === 'Enter') window.cracktroAPI.close();
    else if (e.key === ' ') {
      e.preventDefault();
      cfg.music = !cfg.music; applyMusic(); window.cracktroAPI.set('cracktroMusic', cfg.music);
    }
    else if (e.key === 'f' || e.key === 'F') window.cracktroAPI.toggleFullscreen();
    else if (e.key === 't' || e.key === 'T') { crt = !crt; applyCrt(); window.cracktroAPI.set('cracktroCrt', crt); }
  });

  // diagnostic handle for tests: state, live audio bands, forced effects
  window.__ck = {
    state: function () {
      return {
        v: 3,
        scrollLen: SCROLL.length,
        triggers: triggers.length,
        phases: triggers.map(function (tr) { return tr.effect + ':' + tr.phase; }),
        musicDuration: tune.duration || 0,
        musicPlaying: !cfg.music ? 'off' : (tune.paused ? 'paused' : 'playing'),
        ohnoDuration: ohno.duration || 0,          // > 0 proves the wav loaded
        ohnoReady: ohno.readyState,                // 4 = enough data to play through
        sfxPop: sfx.pop ? sfx.pop.length : 0,      // rendered buffer lengths (0 until first use)
        sfxPing: sfx.ping ? sfx.ping.length : 0,
        sfxZap: sfx.zap ? sfx.zap.length : 0, secretLine: !!secretLine,
        mix: { ohno: OHNO_MIX, pop: POP_MIX, ping: PING_MIX },
        smoke: smoke.length, parts: parts.length, rings: rings.length,
        planet: planet ? planet.def.type : null, craft: craft.map(function (k) { return k.kind; }),
        fight: !!fight, comet: !!comet, found: found, crt: crt, typedLen: typed.length,
        bassN: Number(bassN.toFixed(3)),
        energyN: Number(energyN.toFixed(3)),
        band: band.map(function (b) { return Number(b.toFixed(2)); })
      };
    },
    burst: function () { megaBurst(W / 2, H - 60); },
    rings: function () { ringSet(W / 2, H - 60); },
    // v1.5: park the scroller so a word is about to enter from the right,
    // then let the real sequence run. Returns false if the word isn't there.
    seek: function (word) {
      var x2 = document.createElement('canvas').getContext('2d');
      x2.font = 'bold 17px "DejaVu Sans Mono", monospace';
      var cw = x2.measureText('M').width, idx = SCROLL.indexOf(word);
      if (idx < 0) return false;
      sx = W - idx * cw + cw * 0.5;
      for (var i = 0; i < triggers.length; i++) {
        triggers[i].fired = false; triggers[i].phase = 'idle';
        triggers[i].towerH = 0; triggers[i].remain = 0;
      }
      return true;
    },
    ohno: fxOhNo, pop: fxPop, ping: fxPing,
    spawn: function (kind) {                                 // 'planet','saturn','rust','ice','ochre','fight','comet','iss','cruiser','fighter','foo'
      if (kind === 'planet') spawnPlanet(); else if (['saturn', 'rust', 'ice', 'ochre'].indexOf(kind) >= 0) spawnPlanet(kind);
      else if (kind === 'saturnGiant' || kind === 'jupiter') spawnPlanet(kind);
      else if (kind === 'fight') spawnFight(); else if (kind === 'comet') spawnComet();
      else if (kind === 'sputnik' || kind === 'voyager' || kind === 'hubble') spawnCraft('sat', kind);
      else spawnCraft(kind);
      return true;
    },
    secret: function (w) { if (w === 'AVID') secretAvid(); else if (w === 'CALIX') secretCalix(); return found; },
    crt: function (v) { crt = !!v; applyCrt(); return crt; },
    renderPop: renderPop, renderPing: renderPing, renderZap: renderZap
  };

  // ---- boot ----
  window.cracktroAPI.getConfig().then(function (info) {
    cfg = Object.assign(cfg, info || {});
    document.getElementById('vol').value = cfg.volume;
    document.getElementById('everyLaunch').checked = !!cfg.everyLaunch;
    crt = !!cfg.crt; applyCrt();
    buildScroll();
    applyMusic();
  }).catch(function () { applyMusic(); });
})();
</script>
</body>
</html>
